services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: zenfix.settings.production
    # MongoDB Atlas is the database. Do not add Redis or a local SQL database.

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      DJANGO_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
